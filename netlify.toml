# Plain static site: no build step, serve the repository root.
[build]
  publish = "."

# Always fetch the newest service worker and page so app updates arrive.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
