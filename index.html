<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FAF0D6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Budget">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Budgetcompass</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app. Cream ground, one deep "ink" hero card per screen, category colour carries the budget fills; bottom tab bar with a raised add button. Three skins: lilac, ember, night. */
:root{
  --bg:#FAF0D6; --surface:#FFF9E8; --surface-2:#F3E5C1; --line:#E8D7AC;
  --fg:#2A1A12; --muted:#7A6350; --faint:#B39E7E;
  --accent:#E0502A; --accent-ink:#FFFFFF; --accent-soft:#FCE0D2; --accent-2:#F5A27B;
  --hero:#2E1C14; --hero-fg:#FFF4D9; --hero-muted:#D6BD9C; --hero-line:rgba(255,244,217,.13); --hero-track:rgba(255,244,217,.13);
  --warn:#B9760A; --warn-soft:#F8E4BC; --over:#C2302A; --over-soft:#F9D9D1;
  --shadow:0 1px 0 rgba(42,26,18,.05), 0 10px 30px -18px rgba(42,26,18,.4);
  --font-display:'Bricolage Grotesque', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-body:'Figtree', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r:20px; --r-sm:13px;
  color-scheme:light;
}
:root[data-skin="dusk"]{
  --bg:#2B1C1C; --surface:#372727; --surface-2:#433232; --line:#513E3D;
  --fg:#F6EAD7; --muted:#D4BBA8; --faint:#93706A;
  --accent:#D9654F; --accent-ink:#FFF1E4; --accent-soft:rgba(217,101,79,.18); --accent-2:#E2BA6E;
  --hero:#1E1314; --hero-fg:#F8ECDA; --hero-muted:#CDAE9F; --hero-line:rgba(248,236,218,.1); --hero-track:rgba(248,236,218,.13);
  --warn:#E2BA6E; --warn-soft:rgba(226,186,110,.16); --over:#EE8676; --over-soft:rgba(238,134,118,.16);
  --shadow:0 12px 30px -20px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg); color:var(--fg)}
body{font-family:var(--font-body); font-size:15px; line-height:1.45; -webkit-tap-highlight-color:transparent; min-height:100%; transition:background .3s}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--bg)}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; text-align:left}
input,select,textarea{font:inherit; color:var(--fg)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.ico{width:20px; height:20px; flex:none; display:block}

.app{max-width:560px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); padding-bottom:calc(112px + env(safe-area-inset-bottom,0px));}

/* header */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--bg); display:flex; align-items:center; gap:8px; padding-block:12px 10px; transition:background .3s}
.brand{font-family:var(--font-display); font-weight:800; font-size:17px; letter-spacing:-.01em; flex:1; display:flex; align-items:center; gap:8px; min-width:0}
.brand .logo{flex:none; width:30px; height:30px; display:block}
.month-sw{display:flex; align-items:center; gap:2px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:3px}
.month-sw span{font-weight:600; font-size:14px; padding:0 4px; min-width:112px; text-align:center}
.icon-btn{width:34px; height:34px; display:grid; place-items:center; border-radius:999px; color:var(--muted); flex:none}
.icon-btn:active{background:var(--surface-2)}
.icon-btn .ico{width:18px; height:18px}
.icon-btn[disabled]{opacity:.3}

h1,h2,h3{font-family:var(--font-display); text-wrap:balance; margin:0; letter-spacing:-.01em}
.sec-h{display:flex; align-items:baseline; justify-content:space-between; margin:26px 2px 10px; gap:10px}
.sec-h h2{font-size:19px; font-weight:700}
.sec-h button,.link{color:var(--accent); font-weight:700; font-size:14px}
.stack{display:flex; flex-direction:column; gap:10px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}

/* greeting */
.greet{margin:6px 2px 14px}
.greet small{display:block; color:var(--muted); font-weight:600; font-size:13px}
.greet h1{font-size:30px; font-weight:800; line-height:1.1; margin-top:2px}

/* hero (ink card) */
.hero{background:var(--hero); color:var(--hero-fg); border-radius:26px; padding:20px; position:relative; overflow:hidden}
.hero::before{content:""; position:absolute; width:240px; height:240px; right:-90px; bottom:-120px; border-radius:50%; background:radial-gradient(circle, var(--accent) 0%, transparent 65%); opacity:.35; pointer-events:none}
.hero > *{position:relative}
.eyebrow{font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.hero .eyebrow{color:var(--hero-muted)}
.big{font-family:var(--font-display); font-size:42px; font-weight:800; line-height:1.02; margin:6px 0 4px; letter-spacing:-.03em}
.hero-sub{color:var(--hero-muted); font-size:14px}
.hero-sub b{color:var(--hero-fg); font-weight:700}
.hero-row{display:flex; align-items:center; gap:16px}
.hero-row > div:first-child{flex:1; min-width:0}
.ring{flex:none; width:104px; height:104px; position:relative}
.ring svg{width:100%; height:100%; transform:rotate(-90deg)}
.ring circle{transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.ring-c{position:absolute; inset:0; display:grid; place-items:center; text-align:center; line-height:1.1}
.ring-c b{font-family:var(--font-display); font-size:22px; font-weight:800; display:block}
.ring-c small{font-size:11px; color:var(--hero-muted)}
.hero-line{margin-top:16px; padding-top:14px; border-top:1px solid var(--hero-line); display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.hero-line small{display:block; color:var(--hero-muted); font-size:11.5px}
.hero-line b{font-size:15px; white-space:nowrap}
.daily{margin-top:10px; font-size:13.5px; color:var(--hero-muted)}
.daily b{color:var(--accent-2)}
.hero .btn{margin-top:14px}

/* bars */
.bar{display:block; height:8px; background:var(--surface-2); border-radius:999px; overflow:hidden; position:relative}
.bar i{display:block; height:100%; border-radius:999px; background:var(--c, var(--accent)); transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar i.over{background:var(--over)}
.hero .bar{background:var(--hero-track); height:10px; margin-top:14px}

/* category icon */
.cat-ic{flex:none; width:40px; height:40px; border-radius:13px; display:grid; place-items:center; color:color-mix(in srgb, var(--c) 50%, #3A2418); background:color-mix(in srgb, var(--c) 42%, var(--surface))}
.cat-ic .ico{width:20px; height:20px}
:root[data-skin="dusk"] .eyebrow{color:#C98B80}
:root[data-skin="dusk"] .hero{background:linear-gradient(150deg, #4E1C21 0%, #2A1416 55%, #1E1314 100%)}
:root[data-skin="dusk"] .sec-h h2{color:#F3D9CC}
:root[data-skin="dusk"] .card{background:linear-gradient(180deg, color-mix(in srgb, #5A1E24 22%, var(--surface)), var(--surface))}
:root[data-skin="dusk"] .cat-ic{color:var(--c); background:color-mix(in srgb, var(--c) 22%, transparent)}

/* quick add */
.quick{display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory; padding:2px 2px 6px; margin:0 -2px; scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.qa{flex:none; width:118px; scroll-snap-align:start; padding:12px; display:flex; flex-direction:column; gap:10px}
.qa:active{transform:scale(.97)}
.qa b{display:block; font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.qa small{color:var(--muted); font-size:12.5px}
.qa .cat-ic{width:34px; height:34px; border-radius:11px}
.qa .cat-ic .ico{width:17px; height:17px}

/* health counters */
.health{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.hc{padding:12px; display:flex; flex-direction:column; gap:2px}
.hc b{font-family:var(--font-display); font-size:26px; font-weight:800; line-height:1.1}
.hc small{font-size:12.5px; color:var(--muted); font-weight:600}
.hc.ok b{color:var(--accent)} .hc.warn b{color:var(--warn)} .hc.over b{color:var(--over)}
.insight{display:flex; gap:12px; align-items:flex-start; padding:14px; margin-top:10px}
.insight .cat-ic{width:36px; height:36px}
.insight p{margin:0; font-size:14px}
.insight small{color:var(--muted)}

/* rows */
.row{display:flex; gap:12px; align-items:center; width:100%; padding:12px 14px}
.row + .row{border-top:1px solid var(--line)}
.row:active{background:var(--surface-2)}
.row-main{flex:1; min-width:0; display:flex; flex-direction:column; gap:5px}
.row-top{display:flex; justify-content:space-between; gap:8px; align-items:baseline}
.row-name{font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.row-meta{font-size:12.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.row-amt{font-weight:700; white-space:nowrap}
.pill{display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:700; padding:2px 8px; border-radius:999px; white-space:nowrap}
.pill.over{background:var(--over-soft); color:var(--over)}
.pill.warn{background:var(--warn-soft); color:var(--warn)}
.pill.ok{background:var(--accent-soft); color:var(--accent)}
.pill.mute{background:var(--surface-2); color:var(--muted)}
.rec-badge{display:inline-flex; vertical-align:-3px; margin-left:5px; color:var(--accent)}
.rec-badge .ico{width:14px; height:14px}
.day-h{display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:var(--muted); padding:16px 4px 6px; text-transform:uppercase; letter-spacing:.06em}

/* budget tiles — fill like a glass */
.tiles{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.tile{position:relative; overflow:hidden; min-height:150px; padding:14px; display:flex; flex-direction:column; justify-content:space-between; gap:10px; isolation:isolate}
.tile:active{transform:scale(.98)}
.fill{position:absolute; left:0; right:0; bottom:0; z-index:-1; background:color-mix(in srgb, var(--c) 22%, transparent); transition:height 1s cubic-bezier(.2,.8,.2,1); border-top:2px solid var(--c)}
.fill::before{content:""; position:absolute; left:0; right:0; top:-9px; height:9px; background:radial-gradient(10px 9px at 10px 9px, color-mix(in srgb, var(--c) 22%, transparent) 99%, transparent 101%) 0 0/20px 9px repeat-x; animation:wave 3.5s linear infinite; opacity:.9}
.fill.over{background:repeating-linear-gradient(-45deg, color-mix(in srgb, var(--over) 22%, transparent) 0 8px, color-mix(in srgb, var(--over) 13%, transparent) 8px 16px); border-top-color:var(--over)}
.fill.over::before{display:none}
.fill.zero{display:none}
.fill.zero::before{display:none}
@keyframes wave{to{background-position-x:20px}}
.tile-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px}
.tile-pct{font-family:var(--font-display); font-weight:800; font-size:15px; color:var(--muted)}
.tile-pct.over{color:var(--over)}
.tile-name{font-weight:700; font-size:14.5px; line-height:1.2; overflow-wrap:anywhere}
.tile-amt{font-family:var(--font-display); font-size:21px; font-weight:800; letter-spacing:-.02em; line-height:1.15; margin-top:2px}
.tile-amt small{font-family:var(--font-body); font-size:12.5px; font-weight:600; color:var(--muted); letter-spacing:0}
.tile-st{font-size:12.5px; font-weight:600; color:var(--muted); margin-top:3px}
.tile-st.over{color:var(--over)} .tile-st.warn{color:var(--warn)}
.tile.flash{animation:flash 1s ease}
@keyframes flash{30%{transform:scale(1.04)}}
.total-card{padding:16px}
.total-card .bar{height:14px; margin-top:12px}

.empty{padding:26px 20px; text-align:center; color:var(--muted)}
.empty h3{color:var(--fg); font-size:17px; margin-bottom:6px}
.empty .ico-big{width:52px; height:52px; border-radius:18px; display:grid; place-items:center; margin:0 auto 12px; background:var(--accent-soft); color:var(--accent)}
.empty .ico-big .ico{width:24px; height:24px}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:46px; padding:0 18px; border-radius:14px; font-weight:700; background:var(--surface-2); border:1px solid var(--line)}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent}
.hero .btn.primary{background:var(--hero-fg); color:var(--hero)}
.btn.danger{color:var(--over); background:var(--over-soft); border-color:transparent}
.btn.block{width:100%}
.btn:active{transform:scale(.98)}
.btn .ico{width:18px; height:18px}

/* forms */
.field{display:flex; flex-direction:column; gap:6px; min-width:0}
.field label, .lbl{font-size:12.5px; font-weight:700; color:var(--muted); letter-spacing:.02em}
.inp{width:100%; background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:12px 14px; min-height:46px; font-size:16px}
.inp::placeholder{color:var(--faint)}
.inp:focus{outline:none; border-color:var(--accent); background:var(--surface)}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.seg{display:grid; grid-template-columns:1fr 1fr; gap:4px; background:var(--surface-2); padding:4px; border-radius:13px}
.seg button{padding:9px; border-radius:10px; text-align:center; font-weight:700; color:var(--muted)}
.seg button.on{background:var(--surface); color:var(--fg); box-shadow:var(--shadow)}

/* bottom nav */
.nav{position:fixed; left:0; right:0; bottom:0; z-index:25; background:color-mix(in srgb, var(--surface) 90%, transparent); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); padding-left:env(safe-area-inset-left,0px); padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:560px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr); align-items:end; height:64px}
.nav button{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; height:100%; font-size:11px; font-weight:700; color:var(--faint)}
.nav button .ico{width:22px; height:22px}
.nav button.on{color:var(--accent)}
.nav .add span{width:58px; height:58px; border-radius:20px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; transform:translateY(-14px); box-shadow:0 12px 24px -10px var(--accent), 0 0 0 5px var(--bg)}
.nav .add .ico{width:28px; height:28px; stroke-width:2.6}

/* sheet */
.backdrop{position:fixed; inset:0; z-index:40; background:rgba(20,14,30,.45); opacity:0; transition:opacity .2s}
.backdrop.show{opacity:1}
.sheet{position:fixed; left:0; right:0; bottom:0; z-index:41; max-width:560px; margin:0 auto; max-height:94%; overflow-y:auto; overscroll-behavior:contain; background:var(--bg); border-radius:28px 28px 0 0; padding:8px max(18px, env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px, env(safe-area-inset-left,0px)); transform:translateY(100%); transition:transform .3s cubic-bezier(.2,.8,.2,1); box-shadow:0 -10px 40px -10px rgba(0,0,0,.3)}
.sheet.show{transform:none}
.grab{width:40px; height:5px; border-radius:9px; background:var(--line); margin:4px auto 12px}
.sheet-h{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px}
.sheet-h h2{font-size:21px; font-weight:800}
.sheet .stack{gap:14px}
.amount-wrap{display:flex; align-items:baseline; justify-content:center; gap:4px; padding:4px 0 0}
.amount-wrap .cur{font-family:var(--font-display); font-size:30px; color:var(--muted); font-weight:700}
.amount-in{background:none; border:0; outline:none; text-align:left; font-family:var(--font-display); font-weight:800; font-size:50px; width:5.2ch; letter-spacing:-.03em; caret-color:var(--accent); padding:0}
.amount-in::placeholder{color:var(--faint)}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chips.scroll{flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; margin:0 -18px; padding:0 18px 2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none; display:inline-flex; align-items:center; gap:7px; padding:7px 12px; min-height:38px; border-radius:999px; background:var(--surface); border:1px solid var(--line); font-size:14px; font-weight:600}
.chip.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.chip small{color:var(--muted); font-weight:600}
.chip .ico{width:16px; height:16px; color:var(--c, var(--muted))}
.chip.ac{animation:pop .25s ease both}
@keyframes pop{from{opacity:0; transform:translateY(4px)}}
.suggest{display:flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--accent)}
.suggest .ico{width:15px; height:15px}

/* drag token + mini tiles */
.drop-h{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap}
.token-row{display:flex; justify-content:center; min-height:50px}
.token{display:inline-flex; align-items:center; gap:10px; padding:8px 16px 8px 10px; border-radius:16px; background:var(--hero); color:var(--hero-fg); font-weight:700; touch-action:none; user-select:none; -webkit-user-select:none; cursor:grab; box-shadow:0 10px 24px -12px rgba(0,0,0,.5); max-width:100%}
.token .grip{display:grid; place-items:center; width:30px; height:30px; border-radius:10px; background:var(--hero-line); color:var(--hero-muted)}
.token .grip .ico{width:16px; height:16px}
.token b{font-family:var(--font-display); font-size:18px}
.token span{color:var(--hero-muted); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:150px}
.token.idle{opacity:.35; cursor:default}
.token.lifted{opacity:.25}
.token.ghost{position:fixed; z-index:70; pointer-events:none; transform:rotate(-3deg) scale(1.05); cursor:grabbing; margin:0}
.mtiles{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.mt{position:relative; overflow:hidden; border-radius:15px; background:var(--surface); border:1.5px solid var(--line); padding:10px 9px 9px; display:flex; flex-direction:column; gap:6px; min-height:84px; transition:border-color .2s, transform .2s}
.mt .cat-ic{width:30px; height:30px; border-radius:10px}
.mt .cat-ic .ico{width:16px; height:16px}
.mt-n{font-size:12.5px; font-weight:700; line-height:1.15; overflow-wrap:anywhere}
.mt-bar{display:block; height:5px; border-radius:9px; background:var(--surface-2); position:relative; overflow:hidden; margin-top:auto}
.mt-bar i{position:absolute; left:0; top:0; bottom:0; background:var(--c); border-radius:9px}
.mt-bar em{position:absolute; top:0; bottom:0; background:var(--c); opacity:.45; transition:width .6s cubic-bezier(.2,.8,.2,1)}
.mt-bar em.over{background:var(--over); opacity:.8}
.mt.sugg{border-color:color-mix(in srgb, var(--accent) 55%, var(--line)); border-style:dashed}
.mt.on{border-color:var(--c); background:color-mix(in srgb, var(--c) 12%, var(--surface))}
.mt.hover{border-color:var(--c); transform:scale(1.06); background:color-mix(in srgb, var(--c) 18%, var(--surface))}
.mt-tag{position:absolute; top:6px; right:6px; font-size:9.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--accent)}
.toggle{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px; background:var(--surface); border:1px solid var(--line); border-radius:13px; width:100%; font-weight:600}
.toggle .sw{flex:none; width:44px; height:26px; border-radius:99px; background:var(--line); position:relative; transition:background .2s}
.toggle .sw::after{content:""; position:absolute; left:3px; top:3px; width:20px; height:20px; border-radius:50%; background:var(--surface); box-shadow:0 1px 3px rgba(0,0,0,.2); transition:transform .2s}
.toggle.on .sw{background:var(--accent)} .toggle.on .sw::after{transform:translateX(18px)}
.toggle small{display:block; color:var(--muted); font-size:12.5px; font-weight:500}
.swatches{display:flex; flex-wrap:wrap; gap:10px}

.sub-row{display:flex; flex-direction:column; gap:7px; padding:12px 14px}

.sub-top{display:flex; justify-content:space-between; gap:8px; align-items:baseline}

.sub-top span i{width:10px; height:10px; border-radius:3px}

/* intro: splash + welcome */
.intro{position:fixed; inset:0; z-index:90; background:var(--bg); overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; transition:opacity .45s ease}

.intro-p{position:absolute; top:0; bottom:0; left:0; right:0; margin:0 auto; max-width:560px; display:flex; flex-direction:column; padding:calc(24px + env(safe-area-inset-top,0px)) max(28px, env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(28px, env(safe-area-inset-left,0px)); transition:transform .6s cubic-bezier(.7,0,.2,1), opacity .5s ease}
.intro-1{align-items:center; justify-content:center; cursor:pointer}
.intro-1.gone{transform:translateY(-100%); opacity:0}
.intro-mark{display:flex; flex-direction:column; align-items:center; gap:20px}
.intro-mark .logo{width:128px; height:128px; animation:breathe 3.6s ease-in-out infinite; filter:drop-shadow(0 22px 26px rgba(46,28,20,.28))}

.wordmark{font-family:var(--font-display); font-weight:800; font-size:25px; letter-spacing:-.02em}

.intro-2.on{opacity:1; transform:none; pointer-events:auto}

.intro-2 h1{font-size:46px; font-weight:800; line-height:1.04; letter-spacing:-.03em; margin-top:30px}

.intro-go{margin-top:auto; display:flex; align-items:center; justify-content:space-between; width:100%; color:var(--muted); font-weight:700; font-size:15px}
.intro-go span:last-child{width:58px; height:58px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; box-shadow:0 12px 24px -12px var(--accent)}
.intro-go .ico{width:24px; height:24px}

/* fly + confetti */
.fly{position:fixed; z-index:72; pointer-events:none; margin:0}
.confetti{position:fixed; z-index:80; width:8px; height:12px; border-radius:2px; pointer-events:none; top:0; left:0}

.toast{position:fixed; left:50%; top:calc(10px + env(safe-area-inset-top,0px)); transform:translate(-50%, -24px); z-index:60; width:max-content; max-width:min(92vw, 480px); background:var(--hero); color:var(--hero-fg); border-radius:15px; padding:12px 16px; font-weight:600; font-size:14px; box-shadow:0 14px 34px -12px rgba(0,0,0,.5); opacity:0; pointer-events:none; transition:all .25s; display:flex; gap:10px; align-items:center}

/* ---------- storage: private db subtree in the viewer's account, localStorage fallback ---------- */
const Store = {
  mode: 'local', base: null, q: {},
  async init() {
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    try {
      if (!window.claude || typeof window.claude.use !== 'function') return;
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      this.base = db.doc('data/users/' + id + '/app');
      await this.base.get();
      this.mode = 'cloud';
    } catch (e) { this.mode = 'local'; this.base = null; }
  },
  ref(key) { return key === 'settings' ? this.base : this.base.collection('months').doc(key); },
  async get(key) {
    if (this.mode === 'cloud') {
      const snap = await this.ref(key).get();
      return snap.exists ? JSON.parse(JSON.stringify(snap.data())) : null;
    }
    try { const raw = localStorage.getItem('bk:' + key); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  },
  write(key, data) {
    const q = this.q[key] || (this.q[key] = { running: false, next: null });
    q.next = JSON.parse(JSON.stringify(data));
    if (!q.running) this.drain(key);
  },
  async drain(key) {
    const q = this.q[key]; q.running = true;
    while (q.next) {
      const d = q.next; q.next = null;
      try { await this.set(key, d); }
      catch (e) {
        if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 400 + Math.random() * 800)); try { await this.set(key, d); continue; } catch (e2) { e = e2; } }
        toast(e && e.code === 'quota_exceeded' ? 'Storage is full. Export a backup, then delete old data.' : 'Couldn’t save. Check your connection and try again.', 'over');
      }
    }
    q.running = false;
  },
  async set(key, d) {
    if (this.mode === 'cloud') return this.ref(key).set(d);
    try { localStorage.setItem('bk:' + key, JSON.stringify(d)); } catch (e) {}
  },
  /* Remove every Budgetcompass record: the account copy (if any) and everything on this device. */
  async deleteAll() {
    Object.values(this.q).forEach(q => { q.next = null; });
    const keys = await this.monthKeys();
    if (this.mode === 'cloud') { for (const k of keys) await this.ref(k).delete(); await this.base.delete(); }
    try { const ks = []; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith('bk:')) ks.push(k); } ks.forEach(k => localStorage.removeItem(k)); } catch (e) {}
  },
  async monthKeys() {
    if (this.mode === 'cloud') {
      const snap = await this.base.collection('months').get();
      return snap.docs.map(d => d.id);
    }
    const out = [];
    try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (/^bk:\d{4}-\d{2}$/.test(k)) out.push(k.slice(3)); } } catch (e) {}
    return out;
  }
};

  NAME_HINTS.forEach(l => { const h = hit(l); if (h) { const m = kwMatch(norm(l)); out.push({ label: l, cat: m && m.cat, sub: m && m.sub, amt: 0, score: h * 10 }); } });

}

/* ---------- recurring ---------- */
async function bookRecurring() {
  const cm = curMonth(), td = new Date().getDate();
  let changed = false;
  for (const r of S.settings.recurring) {
    if (r.paused) continue;
    let m = r.lastMonth ? addMonths(r.lastMonth, 1) : (r.startMonth || cm), guard = 0;
    while (m <= cm && guard++ < 24) {
      const day = Math.min(r.day, daysIn(m));
      if (m === cm && td < day) break;
      const md = await getMonth(m);
      md.tx.push({ id: uid(), amt: r.amount, name: r.name, cat: r.cat, sub: r.sub || null, date: m + '-' + p2(day), note: '', rec: r.id });
      saveMonth(m); r.lastMonth = m; changed = true; m = addMonths(m, 1);
    }
  }
  if (changed) saveSettings();
}

/* Fly an element (or a copy of it) into a target, shrinking as it lands. */
function fly(fromEl, toEl, isGhost, done) {
  const a = fromEl.getBoundingClientRect(), b = toEl.getBoundingClientRect();
  let g = fromEl;
  if (!isGhost) { g = fromEl.cloneNode(true); g.removeAttribute('id'); g.classList.add('fly'); Object.assign(g.style, { left: a.left + 'px', top: a.top + 'px', width: a.width + 'px' }); document.body.appendChild(g); }
  const dx = b.left + b.width / 2 - (a.left + a.width / 2), dy = b.top + b.height / 2 - (a.top + a.height / 2);
  g.animate([{ transform: isGhost ? 'rotate(-3deg) scale(1.05)' : 'none', opacity: 1 }, { transform: 'translate(' + dx * 0.6 + 'px,' + (dy * 0.6 - 30) + 'px) scale(.7)', opacity: 1, offset: .55 }, { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(.15)', opacity: 0 }], { duration: 480, easing: 'cubic-bezier(.45,0,.25,1)', fill: 'forwards' }).onfinish = () => { g.remove(); done && done(); };
}

async function saveTx(old, oldMonth, data, makeRec) {
  const m = data.date.slice(0, 7), md = await getMonth(m), c = catOf(data.cat);
  const before = round2(monthTx(m).filter(t => t.cat === data.cat && (!old || t.id !== old.id)).reduce((a, t) => a + t.amt, 0));
  // remember levels for the fill animation
  const vb = visibleCats().filter(x => x.budget > 0), bsum = vb.reduce((a, x) => a + x.budget, 0);
  const bspentBefore = round2(vb.reduce((a, x) => a + monthTx(m).filter(t => t.cat === x.id && (!old || t.id !== old.id)).reduce((s, t) => s + t.amt, 0), 0));
  let t;
  if (old) {
    const om = await getMonth(oldMonth), i = om.tx.findIndex(x => x.id === old.id);
    t = Object.assign({}, i >= 0 ? om.tx[i] : old, data);
    if (oldMonth === m && i >= 0) om.tx[i] = t;
    else { if (i >= 0) { om.tx.splice(i, 1); saveMonth(oldMonth); } md.tx.push(t); }
  } else { t = Object.assign({ id: uid(), ts: Date.now() }, data); md.tx.push(t); }
  if (makeRec) {
    const r = { id: uid(), name: t.name || c.name, amount: t.amt, cat: t.cat, sub: t.sub || null, day: +t.date.slice(8), startMonth: m, lastMonth: m, paused: false };
    S.settings.recurring.push(r); t.rec = r.id;
  }
  saveMonth(m);
  if (t.name) learn(t);
  saveSettings();
  const after = round2(before + t.amt), b = c.budget || 0;
  if (!old && m === S.month) S.anim = { cat: t.cat, from: b ? pctOf(before, b) : 0, totalFrom: bsum ? Math.min(100, bspentBefore / bsum * 100) : null };
  if (b && after > b && before <= b) toast(c.name + ': budget exceeded by ' + money(after - b), 'over', 3600);
  else if (b && after > b) toast(c.name + ': now ' + money(after - b) + ' over budget', 'over', 3200);
  else if (b && after >= 0.8 * b) toast(c.name + ': ' + money(b - after) + ' left in this budget', 'warn', 3200);
  else toast((old ? 'Saved' : 'Added') + ' to ' + c.name + (makeRec ? ' · repeats monthly' : ''));
  if (!old && m !== S.month) S.month = m;
  await getMonth(S.month); render();
}
async function deleteTx(t, m) {
  const md = await getMonth(m), i = md.tx.findIndex(x => x.id === t.id);
  if (i >= 0) { md.tx.splice(i, 1); saveMonth(m); toast('Expense deleted'); render(); }
}
function saveRec(old, data) {
  if (old) { Object.assign(S.settings.recurring.find(r => r.id === old.id) || {}, data); toast('Recurring payment saved'); saveSettings(); render(); }
  else {
    S.settings.recurring.push(Object.assign({ id: uid(), startMonth: curMonth(), lastMonth: null }, data));
    learn({ name: data.name, cat: data.cat, sub: data.sub, amt: data.amount });
    saveSettings();
    bookRecurring().then(() => { toast('Recurring payment added · books on the ' + ordinal(data.day)); render(); });
  }
}

/* ---------- export / backup ---------- */
function markBackup(f) { if (/backup/.test(f)) try { localStorage.setItem('bk:lastBackup', new Date().toISOString()); } catch (e) {} }
async function offerFile(filename, data) {
  let dl = null;
  try { dl = window.claude && await window.claude.use('downloads'); } catch (e) {}

    try { await dl.save({ filename, data }); toast('File saved'); markBackup(filename); return; }
    catch (e) { if (e && e.code === 'declined') return; }
  }
  // Installed app: share sheet (iPhone: “Save to Files”), otherwise a normal download
  try {
    const file = new File([data], filename, { type: filename.endsWith('.csv') ? 'text/csv' : 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: filename }); markBackup(filename); return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast('File saved'); markBackup(filename); return;
  } catch (e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(data); toast('Download isn’t available here, so the content was copied to your clipboard', 'warn', 4200); }
  catch (e) { toast('Downloads aren’t available in this view', 'over'); }
}

    const keys = await Store.monthKeys(); await Promise.all(keys.map(getMonth));
    const months = {}; keys.forEach(k => { if (S.months[k] && S.months[k].tx.length) months[k] = S.months[k]; });
    localStorage.setItem(key, JSON.stringify({ app: 'budgetkompass', v: 2, exported: new Date().toISOString(), settings: S.settings, months }));
    const snaps = []; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith('bk:snap:')) snaps.push(k); }
    snaps.sort().slice(0, Math.max(0, snaps.length - 14)).forEach(k => localStorage.removeItem(k));
  } catch (e) {}
}
function listSnaps() { const out = []; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith('bk:snap:')) out.push(k.slice(8)); } } catch (e) {} return out.sort().reverse(); }
function backupNudge() {
  try {
    const last = localStorage.getItem('bk:lastBackup'), shown = localStorage.getItem('bk:backupNudge');
    const days = last ? (Date.now() - new Date(last).getTime()) / 864e5 : 999;
    if (days >= 30 && shown !== todayISO() && (Object.keys(S.settings.learn).length || S.settings.goals.length)) { localStorage.setItem('bk:backupNudge', todayISO()); toast('Time for a backup: Settings → Save backup', 'warn', 4500); }
  } catch (e) {}
}
async function allMonths() { const keys = await Store.monthKeys(); await Promise.all(keys.map(getMonth)); return keys.sort(); }
async function exportCSV() {
  const keys = await allMonths();
  const rows = [['Date', 'Name', 'Amount', 'Category', 'Subcategory', 'Note', 'Recurring']];
  keys.forEach(k => monthTx(k).slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(t => { const c = catOf(t.cat), s = subOf(c, t.sub); rows.push([t.date, t.name, t.amt.toFixed(2).replace('.', ','), c.name, s ? s.name : '', t.note || '', t.rec ? 'yes' : '']); }));
  if (rows.length === 1) { toast('No expenses to export yet', 'warn'); return; }
  const csv = '﻿' + rows.map(r => r.map(v => /[;"\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : v).join(';')).join('\r\n');
  offerFile('budgetcompass-expenses-' + todayISO() + '.csv', csv);
}
async function backup() {
  const keys = await allMonths(), months = {}; keys.forEach(k => months[k] = S.months[k]);
  offerFile('budgetcompass-backup-' + todayISO() + '.json', JSON.stringify({ app: 'budgetkompass', v: 2, exported: new Date().toISOString(), settings: S.settings, months }, null, 1));
}
$('#file-in').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  let data; try { data = JSON.parse(await f.text()); } catch (err) { toast('That file isn’t a valid backup', 'over'); return; }
  if (!data || data.app !== 'budgetkompass' || !data.settings || !data.months) { toast('That file isn’t a Budgetcompass backup', 'over'); return; }
  openSheet(sheetHead('Restore backup?') + '<div class="stack"><p style="margin:0;color:var(--muted)">Backup from ' + esc(String(data.exported || '').slice(0, 10)) + ' with ' + Object.keys(data.months).length + ' months. Your current settings and every month in the backup will be replaced.</p><button class="btn primary block" id="r-ok">Restore</button><button class="btn block" data-close>Cancel</button></div>', sh => {
    $('#r-ok', sh).addEventListener('click', () => {
      S.settings = migrate(data.settings); saveSettings();
      for (const [k, v] of Object.entries(data.months)) if (/^\d{4}-\d{2}$/.test(k) && v && Array.isArray(v.tx)) { S.months[k] = v; saveMonth(k); }
      closeSheet(); toast('Backup restored'); render();
    });
  });
});

/* ---------- global events ---------- */
document.addEventListener('click', e => {
  if (e.target.closest('#sheet')) return;
  const t = e.target;
  const nav = t.closest('[data-nav]'); if (nav) { S.search = ''; go(nav.dataset.nav); return; }
  const ng = t.closest('[data-nav-go]'); if (ng) { go(ng.dataset.navGo); return; }
  const g = t.closest('[data-go]'); if (g) { go(g.dataset.go); return; }
  const ins = t.closest('[data-ins]'); if (ins) { S.insTab = ins.dataset.ins; render(); return; }
  const q = t.closest('[data-quick]'); if (q) { const e2 = S._fav[+q.dataset.quick]; if (e2) openTxSheet({ prefill: { name: e2.label, amt: e2.amt, cat: e2.cat, sub: e2.sub } }); return; }
  const cat = t.closest('[data-cat]'); if (cat) { go('cat', { cat: cat.dataset.cat }); return; }
  const ec = t.closest('[data-editcat]'); if (ec) { openCatSheet(ec.dataset.editcat); return; }
  const tx = t.closest('[data-tx]');
  if (tx) { const m = tx.dataset.m, it = monthTx(m).find(x => x.id === tx.dataset.tx); if (it) openTxSheet({ tx: it, month: m }); return; }
  const rec = t.closest('[data-rec]'); if (rec) { const r = S.settings.recurring.find(x => x.id === rec.dataset.rec); if (r) openTxSheet({ rec: r }); return; }
  const gc = t.closest('[data-goal-check]');
  if (gc) {
    const goal = S.settings.goals.find(x => x.id === gc.dataset.goalCheck); if (!goal) return;
    const before = milestones(goal).filter(x => x.ok).map(x => x.id);
    goal.deposits = goal.deposits || {};
    if (goal.deposits[S.month] > 0) { delete goal.deposits[S.month]; toast('Transfer unticked'); }
    else { goal.deposits[S.month] = goal.monthly; toast(money(goal.monthly) + ' for ' + monthName(S.month) + ' ticked off', 'party'); setTimeout(() => celebrate(goal, before), 1300); }
    saveSettings(); render(); return;
  }
  const ge = t.closest('[data-goal-edit]'); if (ge) { openGoalSheet(ge.dataset.goalEdit); return; }
  const gx = t.closest('[data-goal-extra]'); if (gx) { openExtraSheet(gx.dataset.goalExtra); return; }
  const sk = t.closest('[data-pick-skin]'); if (sk) { S.settings.skin = sk.dataset.pickSkin; saveSettings(); render(); return; }
  const act = t.closest('[data-act]');
  if (act) {
    const a = act.dataset.act;
    if (a === 'add') openTxSheet();
    else if (a === 'activity') { S.insTab = 'activity'; go('insights'); }
    else if (a === 'new-goal') openGoalSheet();
    else if (a === 'new-cat') openCatSheet();
    else if (a === 'new-rec') openTxSheet({ mode: 'rec' });
    else if (a === 'export-csv') exportCSV();
    else if (a === 'backup') backup();
    else if (a === 'restore') $('#file-in').click();
    else if (a === 'wipe') openSheet(sheetHead('Delete all data?') + '<div class="stack"><p style="margin:0;color:var(--muted)">This permanently deletes all expenses, budgets, categories, savings goals, recurring payments, learned names and the automatic daily copies' + (Store.mode === 'cloud' ? ' — here and in your Claude account' : ' on this device') + '. Save a backup first if you want to keep anything.</p><button class="btn danger block" id="wipe-ok">Delete everything</button><button class="btn block" data-close>Cancel</button></div>', sh => {
      $('#wipe-ok', sh).addEventListener('click', ev => confirmBtn(ev.currentTarget, 'Tap again — this can’t be undone', async () => {
        try { await Store.deleteAll(); } catch (e) { toast('Couldn’t delete everything. Try again.', 'over'); return; }
        S.settings = defaultSettings(); S.months = {}; S.monthP = {}; S.month = curMonth();
        closeSheet(); toast('All data deleted'); go('home');
      }));
    });
    else if (a === 'snaps') openSheet(sheetHead('Automatic backups') + '<div class="stack"><p style="margin:0;color:var(--muted)">The app keeps a copy of everything once a day on this device (last 14 days). Restoring replaces your current data.</p><div class="card">' + listSnaps().map(d => '<button class="set-row" data-snap="' + esc(d) + '"><span class="t"><b>' + esc(dayLabel(d)) + '</b><small>' + esc(d) + '</small></span><span class="chev">' + ico('chevron-right') + '</span></button>').join('') + '</div></div>', sh => {
      sh.addEventListener('click', ev => { const b = ev.target.closest('[data-snap]'); if (!b) return; confirmBtn(b.querySelector('b'), 'Tap again to restore', () => { try { const data = JSON.parse(localStorage.getItem('bk:snap:' + b.dataset.snap)); S.settings = migrate(data.settings); saveSettings(); for (const [k, v] of Object.entries(data.months)) { S.months[k] = v; saveMonth(k); } closeSheet(); toast('Backup from ' + b.dataset.snap + ' restored'); render(); } catch (e) { toast('That copy can’t be read', 'over'); } }); });
    });
    else if (a === 'forget') confirmBtn(act.querySelector('b'), 'Tap again to forget', () => { S.settings.learn = {}; saveSettings(); toast('Learned names cleared'); render(); });
  }
});
$('#btn-add').addEventListener('click', () => { if (S.settings) openTxSheet(); });
$('#btn-settings').addEventListener('click', () => { if (S.settings) go('settings'); });
$('#m-prev').addEventListener('click', () => { if (!S.settings) return; S.month = addMonths(S.month, -1); go(S.view); });
$('#m-next').addEventListener('click', () => { if (!S.settings || S.month >= curMonth()) return; S.month = addMonths(S.month, 1); go(S.view); });

/* Reload from the store when the app comes back to the foreground (e.g. after using another device). */
let lastSync = Date.now();
document.addEventListener('visibilitychange', async () => {
  if (document.hidden || !S.settings || Date.now() - lastSync < 20000) return;
  if (!$('#sheet').hidden || Object.values(Store.q).some(q => q.running)) return;
  lastSync = Date.now();
  try {
    const st = await Store.get('settings'); if (st) S.settings = migrate(st);
    S.months = {}; await getMonth(S.month); await bookRecurring(); render();
  } catch (e) {}
});

/* Once a day, from the 20th: a gentle top notification for savings transfers not ticked off yet. */
function savingsNudge() {
  if (!S.settings || new Date().getDate() < 20) return;
  const m = curMonth(), open = S.settings.goals.filter(g => g.monthly > 0 && !((g.deposits || {})[m] > 0));
  if (!open.length) return;
  const key = 'bk:nudge', today = todayISO();
  try { if (localStorage.getItem(key) === today) return; localStorage.setItem(key, today); } catch (e) {}
  toast(open.length === 1 ? 'Don’t forget: ' + money(open[0].monthly) + ' for “' + open[0].name + '” this month' : 'Don’t forget: ' + open.length + ' savings transfers still open this month', 'warn', 4200);
}

/* ---------- intro: splash → welcome → app ---------- */
(function intro() {
  const el = $('#intro'), p1 = $('#intro-1'), p2 = $('#intro-2');
  const hr = new Date().getHours();
  $('#intro-greet').textContent = greeting() + '.';
  let step = 1, y0 = null;
  const next = () => {
    if (step === 1) { step = 2; p1.classList.add('gone'); p2.classList.add('on'); }
    else if (step === 2) { step = 3; el.classList.add('out'); setTimeout(() => { el.hidden = true; }, 480); if (S.settings) { render(true); setTimeout(savingsNudge, 900); } }
  };
  el.addEventListener('pointerdown', e => { y0 = e.clientY; });
  el.addEventListener('pointerup', e => {
    const dy = y0 == null ? 0 : e.clientY - y0; y0 = null;
    if (dy < -30 || (step === 1 && Math.abs(dy) < 10)) next();
  });
  $('#intro-go').addEventListener('click', e => { e.stopPropagation(); if (step === 2) next(); });
  document.addEventListener('keydown', e => { if (!el.hidden && (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowUp')) { e.preventDefault(); next(); } });
})();

/* ---------- boot ---------- */
(async function boot() {
  await Store.init();
  let st = null; try { st = await Store.get('settings'); } catch (e) {}
  const needsSave = !st || (st.v || 1) < 4;
  S.settings = st ? migrate(st) : defaultSettings();
  if ($('#intro-greet')) $('#intro-greet').textContent = greeting() + '.';
  if (needsSave) saveSettings();
  await getMonth(S.month);
  await bookRecurring();
  render(true);
  setTimeout(() => { snapshot(); backupNudge(); }, 2500);
})();
})();
</script>

<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
